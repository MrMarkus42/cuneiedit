[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained (no vulnerability), no successor yet. Linux screen-reader support only:
# eframe -> accesskit_unix -> atspi -> zbus. Revisit with every egui update.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant; Linux a11y stack via accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names; Linux a11y stack via accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive; Linux a11y stack via accesskit_unix" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]

[licenses.private]
ignore = true

# Fonts bundled by egui.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
