[package]
name = "cuneiedit-macos"
description = "The few macOS integrations of CuneiEdit that need Objective-C calls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSString",
    "NSURL",
] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
    "std",
    "PDFDocument",
    "objc2-app-kit",
] }

# The only crate allowed to use `unsafe` (Objective-C calls); see CONTRIBUTING.md.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
